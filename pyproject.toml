[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferkernellab"
version = "0.2.0"
description = "A small, auditable laboratory for paged KV cache and LLM decode attention"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
cuda = ["triton>=2.1"]
hf = ["transformers>=4.57,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
